[package]
name = "AuctionFlipperNode"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
json = "0.12.4"
serde_derive = "1.0.136"
cli-clipboard = "0.2.1"
colored = "2.0.0"
warp = "0.3"
tokio = { version = "1.18.2", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0.137", features = ["derive"] }
dashmap = { version = "5.3.3", features = ["serde"] }
hematite-nbt = "0.5.2"
lazy_static = "1.4.0"
futures = "0.3.21"
base64 = "0.13.0"
dotenv = "0.15.0"
chrono = "0.4.19"
serde_json = "1.0.81"
surf = { version = "2.3.2", features = ["curl-client"] }


 
[profile.release]
codegen-units = 1
debug = true
incremental = false
lto = true
opt-level = 3
overflow-checks = true
panic = "abort"